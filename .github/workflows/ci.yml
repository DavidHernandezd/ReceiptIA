name: CI - ReceiptIA

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas-backend:
    name: Validar backend de ReceiptIA
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Backend/requirements-dev.txt

      - name: Instalar Tesseract y librerías del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-spa \
            libgl1 \
            libglib2.0-0

      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Revisar errores importantes con Ruff
        run: python -m ruff check .

      - name: Ejecutar pruebas automatizadas
        run: |
          mkdir -p reportes
          python -m pytest -v --junitxml=reportes/pytest.xml

      - name: Guardar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-receiptia
          path: Backend/reportes/
          if-no-files-found: warn
          retention-days: 14