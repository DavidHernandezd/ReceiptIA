name: Evaluación IA - ReceiptIA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluar-modelo:
    name: Evaluar Gemini
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: Backend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: Backend/requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ejecutar evaluación automática de IA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python evaluacion/evaluar_modelo.py

      - name: Guardar resultados de evaluación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluacion-ia-receiptia
          path: Backend/evaluacion/resultados/
          if-no-files-found: warn
          retention-days: 14